name: Despliegue a Azure Static Web Apps

# Compila la aplicación (React + Vite) y la despliega en Azure Static Web
# Apps. El sitio queda con HTTPS habilitado automáticamente, requisito
# indispensable para poder usar navigator.mediaDevices.getUserMedia()
# (acceso a la cámara) desde el navegador.
#
# Variables/secretos requeridos en GitHub → Settings → Secrets and
# variables → Actions:
#   AZURE_STATIC_WEB_APPS_API_TOKEN  → token de despliegue del recurso
#                                       Azure Static Web App (se obtiene
#                                       al crear el recurso en Azure, o
#                                       en "Manage deployment token").
#   VITE_OCR_ENDPOINT                → URL del endpoint REST de
#                                       reconocimiento de placas
#                                       (incluye el código de acceso).
#   VITE_SUPABASE_URL                → URL del proyecto de Supabase.
#   VITE_SUPABASE_PUBLISHABLE_KEY    → clave pública (publishable) de
#                                       Supabase.
#
# Ninguno de estos valores debe escribirse directamente en el código ni
# en este archivo: todos se inyectan como secretos de GitHub Actions.

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build y despliegue
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build y despliegue en Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          VITE_OCR_ENDPOINT: ${{ secrets.VITE_OCR_ENDPOINT }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '/'
          output_location: 'build'
          skip_app_build: false

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Cierre de recurso temporal (PR)
    steps:
      - name: Cerrar entorno de vista previa
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: 'close'
